version: '3'

vars:
  BUILD_DIR: build
  BUILD_TYPE: Release
  CUDA_ARCH: '86'
  # HOST is only used by local health checks and client tasks. llama-server
  # listens on BIND_HOST so other machines on the LAN can reach it.
  HOST: 127.0.0.1
  BIND_HOST: 0.0.0.0
  PORT: '8080'
  ROUTER_PRESET: '{{.TASKFILE_DIR}}/models-router.ini'
  CONTEXT_SIZES: '4096,8192,12288,16384'
  EMBED_PORT: '8081'
  EMBED_REPO: 'ggml-org/bge-m3-Q8_0-GGUF'
  EMBED_FILE: 'bge-m3-q8_0.gguf'
  EMBED_PIDFILE: /tmp/llamacpp-embed.pid
  EMBED_LOGFILE: /tmp/llamacpp-embed.log

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  paths:
    desc: Print router paths and endpoint
    cmds:
      - echo "BUILD_DIR={{.BUILD_DIR}}"
      - echo "ROUTER_PRESET={{.ROUTER_PRESET}}"
      - echo "SERVER=./{{.BUILD_DIR}}/bin/llama-server"
      - echo "BIND={{.BIND_HOST}}"
      - echo "ROUTER (local)=http://{{.HOST}}:{{.PORT}}"
      - echo "EMBEDDINGS (local)=http://{{.HOST}}:{{.EMBED_PORT}}"

  configure:
    desc: Configure llama.cpp with CUDA enabled for RTX 3070 (sm_86)
    cmds:
      - >-
        cmake -B {{.BUILD_DIR}}
        -DGGML_CUDA=ON
        -DCMAKE_BUILD_TYPE={{.BUILD_TYPE}}
        -DCMAKE_CUDA_ARCHITECTURES={{.CUDA_ARCH}}

  build:
    desc: Build llama.cpp
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}} -j $(nproc)

  rebuild:
    desc: Clean build directory, reconfigure, and rebuild
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - task: build

  nvidia:
    desc: Show NVIDIA status
    cmds:
      - nvidia-smi

  server:router:
    desc: Start the LAN-accessible model router
    deps: [build]
    cmds:
      - >-
        ./{{.BUILD_DIR}}/bin/llama-server
        --models-preset {{.ROUTER_PRESET}}
        --models-max 1
        --sleep-idle-seconds 120
        --flash-attn on
        --host {{.BIND_HOST}}
        --port {{.PORT}}

  server:fzf_model_runner:
    desc: Select a model and start it as a single-model server
    deps: [build]
    cmds:
      - >-
        python3 ./scripts/fzf-model-runner.py
        {{.ROUTER_PRESET}}
        ./{{.BUILD_DIR}}/bin/llama-server
        {{.BIND_HOST}}
        {{.PORT}}
        --context-sizes {{.CONTEXT_SIZES}}

  server:embed:
    desc: Start the BGE-M3 embedding server
    deps: [build]
    cmds:
      - >-
        ./{{.BUILD_DIR}}/bin/llama-server
        --hf-repo {{.EMBED_REPO}}
        --hf-file {{.EMBED_FILE}}
        --alias bge-m3-embed
        --embeddings
        --pooling mean
        --embd-normalize 2
        -ngl auto
        --fit-target 1024
        -c 8192
        --flash-attn on
        --host {{.HOST}}
        --port {{.EMBED_PORT}}

  server:embed:start:
    desc: Start the BGE-M3 embedding server in the background
    deps: [build]
    cmds:
      - |
        bash -lc '
        set -euo pipefail
        PIDFILE={{.EMBED_PIDFILE}}
        LOGFILE={{.EMBED_LOGFILE}}
        if [ -s "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
          echo "embedding server already running (pid $(cat "$PIDFILE"))"
          exit 0
        fi
        rm -f "$PIDFILE"
        ./{{.BUILD_DIR}}/bin/llama-server \
          --hf-repo {{.EMBED_REPO}} \
          --hf-file {{.EMBED_FILE}} \
          --alias bge-m3-embed \
          --embeddings \
          --pooling mean \
          --embd-normalize 2 \
          -ngl auto \
          --fit-target 1024 \
          -c 8192 \
          --flash-attn on \
          --host {{.HOST}} \
          --port {{.EMBED_PORT}} > "$LOGFILE" 2>&1 &
        echo $! > "$PIDFILE"
        for _ in $(seq 1 120); do
          curl -fsS http://{{.HOST}}:{{.EMBED_PORT}}/health >/dev/null 2>&1 && exit 0
          kill -0 "$(cat "$PIDFILE")" 2>/dev/null || { tail -n 100 "$LOGFILE"; exit 1; }
          sleep 1
        done
        tail -n 100 "$LOGFILE"
        exit 1
        '

  server:embed:stop:
    desc: Stop the background BGE-M3 embedding server
    cmds:
      - |
        bash -lc '
        PIDFILE={{.EMBED_PIDFILE}}
        if [ ! -s "$PIDFILE" ]; then
          echo "embedding server is not running"
          exit 0
        fi
        PID=$(cat "$PIDFILE")
        if kill -0 "$PID" 2>/dev/null; then
          kill "$PID"
          for _ in $(seq 1 10); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
        fi
        rm -f "$PIDFILE"
        '

  server:embed:status:
    desc: Show BGE-M3 embedding server status
    cmds:
      - |
        bash -lc '
        PIDFILE={{.EMBED_PIDFILE}}
        if [ -s "$PIDFILE" ] && kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
          echo "embedding server running (pid $(cat "$PIDFILE"))"
        else
          echo "embedding server is not running"
          exit 1
        fi
        '

  smoke:embed:
    desc: Send a test embedding request
    cmds:
      - >-
        curl -fsS http://{{.HOST}}:{{.EMBED_PORT}}/v1/embeddings
        -H 'Content-Type: application/json'
        -d '{"model":"bge-m3-embed","input":"embedding smoke test"}'

  router:models:
    desc: List models known to the running router
    cmds:
      - curl -fsS http://{{.HOST}}:{{.PORT}}/models

  router:reload:
    desc: Reload router profiles from models-router.ini
    cmds:
      - curl -fsS 'http://{{.HOST}}:{{.PORT}}/models?reload=1'
