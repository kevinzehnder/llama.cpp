# RTX 3070 Qwen profiles
#
# Qwen3.5-9B is multimodal and its projector is in the same repo. Without the
# mmproj, image requests fail. The 128k profile relies on CUDA unified memory.
#
# This text-only profile omits the vision projector to keep VRAM available for
# context and compute buffers.
[qwen-3.5-9b-fast-16k-text]
hf-repo = unsloth/Qwen3.5-9B-GGUF:Q4_K_M
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0

