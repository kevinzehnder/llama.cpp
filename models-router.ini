version = 1

[*]
# Shared defaults for all router-loaded models
host = 127.0.0.1
port = 8080
n-gpu-layers = auto
ctx-size = 8192
parallel = 1
fit = on
fit-target = 1024
flash-attn = on

[gemma-4-e4b-vision-16k]
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q4_0
mmproj = /home/kevinzehnder/.cache/huggingface/hub/models--ggml-org--gemma-4-E4B-it-GGUF/snapshots/b8093469224f83f5c38f691eb906c380e9e63114/mmproj-gemma-4-E4B-it-Q8_0.gguf
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0

# RTX 3070 general-purpose model
[qwen-3.5-4b-fast-32k]
hf-repo = unsloth/Qwen3.5-4B-GGUF:Q4_K_M
mmproj = /home/kevinzehnder/.cache/huggingface/hub/models--unsloth--Qwen3.5-4B-GGUF/snapshots/e87f176479d0855a907a41277aca2f8ee7a09523/mmproj-BF16.gguf
mmproj-offload = true
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0

# Qwen3.5-9B — second opinion on hard coding questions.
#
# Failure history: the first attempt (Q4_K_M + mmproj on GPU @16k) sat at
# ~7.3 GiB before the desktop took its share, spilled into unified memory
# and ran at <1 tok/s — slower than the 27B, which at least streams
# predictably. Diagnosis: PCIe paging, not model quality.
#
# Fixed profile: text-only (vision is covered by the gemma vision profile
# and the OCR specialists), IQ4_XS instead of Q4_K_M, 8k context.
#   weights IQ4_XS           4800 MiB
#   KV cache @8k, q8_0       ~630 MiB
#   compute buffers          ~400 MiB
#   desktop (niri, kitty, browser)  ~1200-1800 MiB
#                          --------
#                          ~7000-7600 MiB of 8192
#
# Fully resident this should sustain 15-25 tok/s. If it still thrashes,
# the next step down is UD-Q3_K_XL (4700 MiB); if that is also unusable,
# this size class does not fit this card and the profile should go.
#
# Measured 2026-09-10, 60 tok/s decoded at this context (pi agent):
# the budget holds. Qwen3.5 is a hybrid SSM model (qwen35 arch, ssm_d_state
# 128, full attention only every Nth layer), so context is cheaper than a
# dense model's — but the card still says no to more:
#   16k + q4_0 KV loaded ONCE at 7674/8192 MiB, then OOMed on the pp
#     compute buffer (136 MiB, context-driven, not batch/ubatch-driven)
#     the moment the desktop grew ~50 MiB. Knife-edge, no good as default.
#   32k: KV allocation OOM outright (544 MiB short).
# 12k is the robust ceiling for the 9B on this card with a desktop resident.
# Bigger windows live on qwen-3.5-4b-fast-32k (smaller weights, 32k).
[qwen-3.5-9b-fast-12k]
hf-repo = unsloth/Qwen3.5-9B-GGUF:IQ4_XS
no-mmproj = true
ctx-size = 12288
cache-type-k = q8_0
cache-type-v = q8_0

# Qwen3.8-27B was removed after measuring 0.7 tok/s: 16 GiB of Q4 weights
# cannot live on an 8 GB card, and even with unified memory it only streams
# ~11 GiB/s over PCIe. Below 1 tok/s was the agreed usability floor; the
# UD-Q4_K_M file stays in the HF cache if a RAM-only workload ever wants it.
# No Qwen3.8-9B exists (family: 27B, Flash-Next >14 GiB, 2.4T MoE), so the
# 9B slot went to Qwen3.5-9B instead.

# Text-only Gemma coding profile; the vision projector is deliberately omitted.
[gemma-4-e4b-coding-16k]
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q4_0
no-mmproj = true
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0

# olmOCR — dedicated OCR VLM, best-in-class on olmOCR-bench (82.4)
#
# 8 GB VRAM budget, single page at a time:
#   weights Q4_K_M          4467 MiB
#   mmproj bf16             1295 MiB   on GPU — this is the whole point
#   KV cache @12k, q8_0     ~350 MiB
#   compute buffers        ~350 MiB
#   desktop (niri, kitty, browser)  ~1200 MiB
#                          --------
#                          ~7660 MiB of 8192
#
# The projector encodes the page image before a single token is generated,
# so leaving it on the CPU costs minutes per page. Context is what pays for
# it: one page needs image tokens + the text-layer anchor + the response,
# nowhere near 32k. Every 1k of context here is ~29 MiB of KV cache that
# could be projector instead.
#
# If this OOMs at load, drop ctx-size to 8192 before touching mmproj-offload.
[olmocr-2-7b]
hf-repo = bartowski/allenai_olmOCR-2-7B-1025-GGUF:Q4_K_M
mmproj = /home/kevinzehnder/.cache/huggingface/hub/models--bartowski--allenai_olmOCR-2-7B-1025-GGUF/snapshots/42654d7abfe9a19d3cdb90b9a855ce26d265fd93/mmproj-allenai_olmOCR-2-7B-1025-bf16.gguf
mmproj-offload = true
ctx-size = 12288
cache-type-k = q8_0
cache-type-v = q8_0

# MinerU2.5-1.2B — a layout-first document parser, not a general-purpose VLM.
# It answers four task names ("Layout Detection:", "Text Recognition:",
# "Table Recognition:", "Formula Recognition:") and nothing else, and the
# layout pass only fires when the image is exactly 1036x1036: at any other
# aspect ratio it answers the layout prompt with a transcription instead.
# docc builds that square itself — see internal/ingest/crop.go — so this
# profile needs nothing special beyond the projector.
#
# The roomiest profile here by a wide margin, being a tenth of olmOCR's size:
#   weights q4_k_m           394 MiB
#   mmproj bf16             1328 MiB   on GPU
#   KV cache @8k, q8_0      ~300 MiB
#   compute buffers         ~350 MiB
#   desktop                ~1800 MiB
#                          --------
#                          ~4200 MiB of 8192
#
# The projector is not auto-resolved and the mmproj line is not optional: the
# file in that repo is named `.mmproj` rather than `mmproj-*.gguf`, which is
# the pattern llama.cpp looks for, so -hf on its own loads text-only weights
# and every image request fails with "image input is not supported". The copy
# below was fetched by hand from the same repo.
[Mungert/MinerU2.5-2509-1.2B-GGUF:Q4_K_M]
hf-repo = Mungert/MinerU2.5-2509-1.2B-GGUF:Q4_K_M
mmproj = /home/kevinzehnder/models/mineru/MinerU2.5-2509-1.2B-bf16.mmproj
mmproj-offload = true
ctx-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0

# MinerU2.5-Pro-2605 — same protocol and same size as the 2509 above, so docc
# swaps between them on the model name alone. Kept as a separate profile
# because the point of having both is scoring one against the other.
#
# The 2605 release cleaned up the layout training data specifically to reduce
# category errors, which is the failure the 2509 shows on our own renders: it
# reports thirteen `title` blocks on a fixture that has eight headings.
#
#   weights q4_k_m           380 MiB
#   mmproj f16              1264 MiB   on GPU
# Local files rather than hf-repo: these came from mradermacher, whose GGUFs
# do use the mmproj-*.gguf name llama.cpp looks for, so this one would in fact
# auto-resolve — the explicit path is only so both MinerU profiles read alike.
[mineru-pro-2605]
model = /home/kevinzehnder/models/mineru/MinerU2.5-Pro-2605-1.2B.Q4_K_M.gguf
mmproj = /home/kevinzehnder/models/mineru/MinerU2.5-Pro-2605-1.2B.mmproj-f16.gguf
mmproj-offload = true
ctx-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0

# Dedicated OCR model from the ggml-org GGUF collection: the repo carries its
# own mmproj, so llama-server pulls the projector with the weights.
#
# Measured against the text layer of an eight-page card statement, dots.ocr was
# the only model of five that lost no figure. GLM-OCR (presses a page into one
# table), DeepSeek-OCR (repeat loop) and LightOnOCR-2 (nine amounts lost) were
# tested here too and removed again.
[dots-ocr]
hf-repo = ggml-org/dots.ocr-GGUF
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0

[nanonets-ocr2]
hf-repo = Mungert/Nanonets-OCR2-3B-GGUF
hf-file = Nanonets-OCR2-3B-q4_k_m.gguf
mmproj = /home/kevinzehnder/models/nanonets/Nanonets-OCR2-3B-bf16.mmproj
# 8192, not 16384: the image compute buffer scales with the window, and at 16k
# it asked for 1.8 GB on top of the weights and the projector — more than an
# 8 GB card has left once the desktop compositor has taken two of them.
ctx-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0

# PaddleOCR-VL-1.6 — the smallest profile here that reads a full page, and the
# one to reach for when the figure that matters sits on a payment slip.
#
# Measured against the text layer of six invoices from 2012 to 2026, it was the
# only model that transcribed an ESR coding line in full — the reference
# number, the account and 0100000088852>000000040363416500198307305+ — where
# LightOnOCR-2 and MinerU dropped the slip entirely and returned clean markdown
# with no amount in it. On the same run it lost the minus sign on one credit
# (-82.50 came back as 82.50), so it is not a model to trust unchecked either.
#
# It answers a trigger phrase ("OCR:") rather than a prompt or silence, which
# is the ocr_prompt setting on readd's `paddle` profile. --jinja is not needed
# here: llama-server enables it by default, and only llama-mtmd-cli refuses
# this template without it.
#
#   weights Q8_0             475 MiB
#   mmproj                   840 MiB   on GPU
#   KV cache @8k, q8_0      ~300 MiB
#   compute buffers         ~600 MiB
#   desktop                ~1800 MiB
#                          --------
#                          ~4000 MiB of 8192
#
# The mmproj line is not optional: the projector in that repo is named
# `PaddleOCR-VL-1.6-mmproj.gguf` rather than the `mmproj-*.gguf` pattern
# llama.cpp resolves on its own, so -hf alone loads text-only weights.
[paddleocr-vl-1.6]
hf-repo = SanjeevSOLANKI/PaddleOCR-VL-1.6-GGUF
hf-file = PaddleOCR-VL-1.6-Q8_0.gguf
mmproj = /home/kevinzehnder/.cache/huggingface/hub/models--SanjeevSOLANKI--PaddleOCR-VL-1.6-GGUF/snapshots/5621cad76de79b793ae45dbcb48153f12c72a7ac/PaddleOCR-VL-1.6-mmproj.gguf
mmproj-offload = true
ctx-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0
